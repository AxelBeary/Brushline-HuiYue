# ============================================
# Artist Commission Platform - Docker Compose
# 一键启动: docker compose up -d
# ============================================
services:
  # Web 应用（前端 + 后端）
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commission-web
    restart: unless-stopped
    # ⚠️ P1-9: 生产环境请改为 expose 并删除 ports，由 Caddy 反向代理
    # expose:
    #   - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data          # SQLite 数据库持久化
      - ./uploads:/app/uploads    # 上传文件持久化
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - AUTH_DEV_MODE=false       # 生产环境必须关闭开发模式
      - DB_PATH=/app/data/commission.db
      - UPLOAD_DIR=/app/uploads
    healthcheck:
      # P2-4: 加 .catch() 防止网络错误时健康检查误判为健康
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Caddy 反向代理（自动 HTTPS + 泛解析）
  caddy:
    image: caddy:2-alpine
    container_name: commission-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env              # P1-10: 提供 DOMAIN 变量给 Caddyfile
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
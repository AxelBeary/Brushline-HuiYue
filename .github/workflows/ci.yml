name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx oxlint src tests
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      # 清扫批#4: web 单测进 CI（此前只跑 lint+build，224 用例仅本地验证）
      - run: npx vitest run
      - run: npm run build
      # 源头防屎门禁：硬编码中文增量拦截（存量已进 baseline）
      - run: npm run check:i18n

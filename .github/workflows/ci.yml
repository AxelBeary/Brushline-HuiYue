name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx oxlint src tests
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      # TS 增量迁移纪律（2026-08-11）：新增 TS 文件/组件受 vue-tsc strict 全量把关
      - run: npm run typecheck
      # 清扫批#4: web 单测进 CI（此前只跑 lint+build，224 用例仅本地验证）
      - run: npx vitest run
      - run: npm run build
      # 源头防屎门禁：硬编码中文增量拦截（存量已进 baseline）
      - run: npm run check:i18n

  # P2-E：Dockerfile 门禁——Dockerfile 层问题（路径/权限/依赖）在合入前暴露
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Docker image build gate
        run: docker build -t commission-ci .
